<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigo Invisible · Navidad</title>
    <style>
        :root {
            --bg-top: #0f2922;
            --bg-bottom: #1b4332;
            --card-bg: #ffffff;
            --primary: #c1121f;
            --primary-hover: #9e0e18;
            --secondary: #2d6a4f;
            --gold: #ffb703;
            --text: #1f2937;
            --muted: #6b7280;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "❄  ✦  ❅  ✦  ❄  ❅  ✦  ❄";
            position: fixed;
            top: 14px;
            left: 0;
            right: 0;
            text-align: center;
            letter-spacing: 1.5rem;
            color: rgba(255, 255, 255, 0.14);
            font-size: 1.2rem;
            pointer-events: none;
        }

        .card {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 2rem 1.5rem;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
            text-align: center;
            border-top: 6px solid var(--gold);
        }

        .badge {
            display: inline-block;
            background: #fef3c7;
            color: #92400e;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 0.3rem 0.75rem;
            border-radius: 999px;
            margin-bottom: 0.75rem;
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.75rem;
            color: var(--bg-top);
        }

        .subtitle {
            margin: 0 0 1.5rem;
            font-size: 0.95rem;
            color: var(--muted);
            line-height: 1.45;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }

        .btn {
            appearance: none;
            border: none;
            border-radius: 12px;
            padding: 0.95rem 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.12s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        .btn-person {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(193, 18, 31, 0.25);
        }

        .btn-person:hover:not(:disabled) {
            background: var(--primary-hover);
        }

        .btn-person:disabled {
            background: #e5e7eb;
            color: #9ca3af;
            box-shadow: none;
            cursor: not-allowed;
            text-decoration: line-through;
        }

        .btn-action {
            width: 100%;
            background: var(--secondary);
            color: #ffffff;
            padding: 1rem;
            font-size: 1.05rem;
            box-shadow: 0 6px 16px rgba(45, 106, 79, 0.28);
        }

        .btn-action:hover:not(:disabled) {
            background: #23533d;
        }

        .btn-action:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .link-box {
            margin-top: 1.25rem;
            background: #f3f4f6;
            border: 1px dashed #d1d5db;
            border-radius: 12px;
            padding: 0.9rem;
            text-align: left;
            font-size: 0.82rem;
            word-break: break-all;
            color: #374151;
        }

        .btn-copy {
            margin-top: 0.75rem;
            width: 100%;
            background: var(--bg-top);
            color: #fff;
            padding: 0.75rem;
            font-size: 0.92rem;
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10, 25, 20, 0.9);
            backdrop-filter: blur(4px);
            padding: 1.5rem;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        .modal-box {
            background: #ffffff;
            color: var(--text);
            width: 100%;
            max-width: 380px;
            border-radius: 20px;
            padding: 2rem 1.5rem;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.45);
            animation: popIn 0.2s ease-out;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.25rem;
        }

        .btn-cancel {
            flex: 1;
            background: #e5e7eb;
            color: #374151;
        }

        .btn-confirm {
            flex: 1;
            background: var(--primary);
            color: #fff;
        }

        .gift-reveal {
            background: linear-gradient(135deg, #1b4332, #0f2922);
            color: #ffffff;
            border: 2px solid var(--gold);
        }

        .nombre-tocado {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--gold);
            margin: 1rem 0;
            letter-spacing: 0.02em;
        }

        .progress-track {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 999px;
            overflow: hidden;
            margin-top: 1rem;
        }

        .progress-bar {
            height: 100%;
            width: 100%;
            background: var(--gold);
            transition: width 1s linear;
        }

        .timer-text {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 0.6rem;
        }
    </style>
</head>
<body>

    <main class="card">
        <span class="badge">Edición Navidad · 3 Familias</span>
        <h1>🎄 Amigo Invisible</h1>
        <div id="contenido"></div>
    </main>

    <div class="overlay" id="modal-confirm">
        <div class="modal-box">
            <div style="font-size: 2.2rem; margin-bottom: 0.5rem;">🎁</div>
            <h2 style="margin: 0 0 0.5rem; font-size: 1.3rem;">¿Eres <span id="confirm-nombre"></span>?</h2>
            <p class="subtitle" style="margin-bottom: 0;">Asegúrate de que nadie más esté mirando la pantalla antes de abrir tu regalo.</p>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="cerrarConfirmacion()">Cancelar</button>
                <button class="btn btn-confirm" id="btn-confirmar-ver">Sí, ver ahora</button>
            </div>
        </div>
    </div>

    <div class="overlay" id="modal-reveal">
        <div class="modal-box gift-reveal">
            <div style="font-size: 2.2rem;">🎅✨</div>
            <p style="margin: 0.5rem 0 0; opacity: 0.9;">Te ha tocado regalar a:</p>
            <div class="nombre-tocado" id="resultado"></div>
            <div class="progress-track">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <p class="timer-text" id="contador">Se cerrará en 5s...</p>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const dataParam = params.get('data');
        const contenedor = document.getElementById('contenido');
        let configSorteo = { reglas: { evitarMismaFamilia: true, mismoGrupoEdad: false }, participantes: [] };

        if (!dataParam) {
            contenedor.innerHTML = `
                <p class="subtitle">Cargando participantes desde <code>participantes.json</code>...</p>
                <button class="btn btn-action" id="btn-generar" onclick="generarSorteo()" disabled>🎲 Generar Enlace del Sorteo</button>
                <div id="zona-link"></div>
            `;
            cargarParticipantes();
        } else {
            try {
                const asignaciones = JSON.parse(decodeURIComponent(atob(dataParam)));
                const storageKey = 'vistos_' + dataParam.slice(0, 12);
                const vistos = JSON.parse(localStorage.getItem(storageKey) || '[]');

                contenedor.innerHTML = `
                    <p class="subtitle">Pulsa tu nombre para descubrir a quién regalas. Solo se mostrará durante 5 segundos.</p>
                    <div class="grid" id="grid"></div>
                `;
                const grid = document.getElementById('grid');

                Object.keys(asignaciones).forEach(persona => {
                    const btn = document.createElement('button');
                    btn.className = 'btn btn-person';
                    btn.textContent = persona;
                    if (vistos.includes(persona)) {
                        btn.disabled = true;
                        btn.textContent = `${persona} ✓`;
                    }
                    btn.onclick = () => pedirConfirmacion(persona, asignaciones[persona], btn, storageKey);
                    grid.appendChild(btn);
                });
            } catch (e) {
                contenedor.innerHTML = `<p class="subtitle" style="color:#c1121f;">El enlace del sorteo no es válido o está incompleto.</p>`;
            }
        }

        async function cargarParticipantes() {
            const btnGenerar = document.getElementById('btn-generar');
            try {
                const resp = await fetch('./participantes.json', { cache: 'no-store' });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const json = await resp.json();
                configSorteo = {
                    reglas: Object.assign({ evitarMismaFamilia: true, mismoGrupoEdad: false }, json.reglas || {}),
                    participantes: Array.isArray(json.participantes) ? json.participantes : []
                };
                if (configSorteo.participantes.length < 2) {
                    throw new Error('Se necesitan al menos 2 participantes');
                }
                contenedor.querySelector('.subtitle').innerHTML =
                    `Cargados <strong>${configSorteo.participantes.length}</strong> participantes desde <code>participantes.json</code>.`;
                btnGenerar.disabled = false;
            } catch (err) {
                contenedor.querySelector('.subtitle').innerHTML =
                    `<span style="color:#c1121f;">Error al leer <code>participantes.json</code> (${err.message}). Revisa que exista en la raíz y tenga JSON válido.</span>`;
            }
        }

        function generarSorteo() {
            const lista = configSorteo.participantes;
            const reglas = configSorteo.reglas;
            let valido = false;
            let resultado = {};
            let intentos = 0;

            while (!valido && intentos < 10000) {
                intentos++;
                let receptores = [...lista].sort(() => Math.random() - 0.5);
                valido = true;
                resultado = {};

                for (let i = 0; i < lista.length; i++) {
                    const dador = lista[i];
                    const receptor = receptores[i];

                    if (dador.nombre === receptor.nombre) {
                        valido = false;
                        break;
                    }
                    if (reglas.evitarMismaFamilia && dador.familia === receptor.familia) {
                        valido = false;
                        break;
                    }
                    if (reglas.mismoGrupoEdad && dador.grupo && receptor.grupo && dador.grupo !== receptor.grupo) {
                        valido = false;
                        break;
                    }
                    resultado[dador.nombre] = receptor.nombre;
                }
            }

            if (!valido) {
                alert("No se encontró un reparto válido con esas reglas. Revisa el tamaño de las familias o grupos en participantes.json.");
                return;
            }

            const payload = btoa(encodeURIComponent(JSON.stringify(resultado)));
            const urlFinal = `${window.location.origin}${window.location.pathname}?data=${payload}`;

            document.getElementById('zona-link').innerHTML = `
                <div class="link-box" id="url-texto">${urlFinal}</div>
                <button class="btn btn-copy" onclick="copiarEnlace('${urlFinal}', this)">📋 Copiar enlace para WhatsApp</button>
            `;
        }

        function copiarEnlace(url, btn) {
            navigator.clipboard.writeText(url).then(() => {
                const original = btn.textContent;
                btn.textContent = "✅ ¡Enlace copiado!";
                setTimeout(() => btn.textContent = original, 2000);
            });
        }

        function pedirConfirmacion(persona, tocado, boton, storageKey) {
            const modalConfirm = document.getElementById('modal-confirm');
            document.getElementById('confirm-nombre').textContent = persona;
            modalConfirm.style.display = 'flex';

            const btnConfirmar = document.getElementById('btn-confirmar-ver');
            btnConfirmar.onclick = () => {
                cerrarConfirmacion();
                revelar(persona, tocado, boton, storageKey);
            };
        }

        function cerrarConfirmacion() {
            document.getElementById('modal-confirm').style.display = 'none';
        }

        function revelar(persona, tocado, boton, storageKey) {
            const modal = document.getElementById('modal-reveal');
            const contador = document.getElementById('contador');
            const bar = document.getElementById('progress-bar');

            document.getElementById('resultado').textContent = tocado;
            bar.style.transition = 'none';
            bar.style.width = '100%';
            modal.style.display = 'flex';

            const vistos = JSON.parse(localStorage.getItem(storageKey) || '[]');
            if (!vistos.includes(persona)) {
                vistos.push(persona);
                localStorage.setItem(storageKey, JSON.stringify(vistos));
            }

            boton.disabled = true;
            boton.textContent = `${persona} ✓`;

            void bar.offsetWidth;
            bar.style.transition = 'width 5s linear';
            bar.style.width = '0%';

            let segundos = 5;
            contador.textContent = `Se cerrará en ${segundos}s...`;
            const intervalo = setInterval(() => {
                segundos--;
                contador.textContent = `Se cerrará en ${segundos}s...`;
                if (segundos <= 0) {
                    clearInterval(intervalo);
                    modal.style.display = 'none';
                }
            }, 1000);
        }
    </script>
</body>
</html>
