<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#06141f">
    <title>Amigo Invisible · Noche de Regalos</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --cielo-1: #040b16;
            --cielo-2: #0b1f33;
            --cielo-3: #17324a;
            --oro: #fbbf24;
            --oro-claro: #fde68a;
            --texto: #f1f5f9;
            --texto-suave: #cbd5e1;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body { margin: 0; min-height: 100%; }

        body {
            min-height: 100vh;
            font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--texto);
            background:
                radial-gradient(ellipse at 18% 12%, rgba(253, 230, 138, 0.10), transparent 40%),
                radial-gradient(ellipse at 85% 30%, rgba(56, 189, 248, 0.08), transparent 45%),
                linear-gradient(180deg, var(--cielo-1) 0%, var(--cielo-2) 45%, var(--cielo-3) 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 64px 14px 34vh;
            overflow-x: hidden;
        }

        /* ---------- Cielo ---------- */
        .estrellas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .estrella {
            position: absolute;
            width: 2px; height: 2px;
            background: #fff;
            border-radius: 50%;
            animation: brillar 3s ease-in-out infinite;
        }
        @keyframes brillar { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

        .luna {
            position: fixed;
            top: 9vh; left: 8vw;
            width: 78px; height: 78px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fffbea 0%, #fde68a 55%, #fbbf24 100%);
            box-shadow: 0 0 40px 12px rgba(253, 230, 138, .35), 0 0 120px 40px rgba(253, 230, 138, .12);
            z-index: 0;
            pointer-events: none;
        }
        .luna::before, .luna::after {
            content: ""; position: absolute; border-radius: 50%; background: rgba(217, 119, 6, .18);
        }
        .luna::before { width: 16px; height: 16px; top: 22px; left: 40px; }
        .luna::after { width: 10px; height: 10px; top: 46px; left: 22px; }

        .trineo {
            position: fixed;
            top: 14vh;
            left: 0;
            font-size: 1.5rem;
            white-space: nowrap;
            z-index: 1;
            pointer-events: none;
            filter: drop-shadow(0 0 6px rgba(253, 230, 138, .6));
            animation: volar 32s linear infinite;
            animation-delay: 3s;
            transform: translateX(110vw);
        }
        .trineo .estela { font-size: .8rem; opacity: .8; letter-spacing: 2px; }
        @keyframes volar {
            0%   { transform: translate(110vw, 0) rotate(-4deg); }
            25%  { transform: translate(75vw, -18px) rotate(3deg); }
            50%  { transform: translate(40vw, 6px) rotate(-3deg); }
            75%  { transform: translate(5vw, -14px) rotate(3deg); }
            100% { transform: translate(-40vw, 0) rotate(-4deg); }
        }

        #nieve { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
        #confeti { position: fixed; inset: 0; z-index: 80; pointer-events: none; }

        /* ---------- Paisaje ---------- */
        .paisaje {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            height: 30vh;
            min-height: 170px;
            z-index: 2;
            pointer-events: none;
        }
        .paisaje svg { width: 100%; height: 100%; display: block; }
        .ventana { animation: luzVentana 4s ease-in-out infinite; }
        @keyframes luzVentana { 0%, 100% { opacity: 1; } 50% { opacity: .65; } }

        /* ---------- Guirnalda ---------- */
        .guirnalda {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 44px;
            z-index: 30;
            pointer-events: none;
            display: flex;
            justify-content: space-around;
            background:
                radial-gradient(ellipse 60px 18px at 50% -6px, transparent 16px, #0f2d1f 17px, #0f2d1f 19px, transparent 20px) 0 0 / 64px 30px repeat-x;
        }
        .bombilla {
            position: relative;
            width: 12px; height: 18px;
            margin-top: 10px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            animation: parpadeo 2.2s ease-in-out infinite;
        }
        .bombilla::before {
            content: ""; position: absolute; top: -5px; left: 3px; width: 6px; height: 6px;
            background: #334155; border-radius: 2px;
        }
        .bombilla:nth-child(odd) { margin-top: 16px; }
        .bombilla:nth-child(5n+1) { background: #ef4444; --g: #ef4444; animation-delay: 0s; }
        .bombilla:nth-child(5n+2) { background: #facc15; --g: #facc15; animation-delay: .4s; }
        .bombilla:nth-child(5n+3) { background: #22c55e; --g: #22c55e; animation-delay: .8s; }
        .bombilla:nth-child(5n+4) { background: #38bdf8; --g: #38bdf8; animation-delay: 1.2s; }
        .bombilla:nth-child(5n+5) { background: #e879f9; --g: #e879f9; animation-delay: 1.6s; }
        @keyframes parpadeo {
            0%, 100% { opacity: .5; box-shadow: 0 0 4px var(--g); }
            50% { opacity: 1; box-shadow: 0 0 16px 3px var(--g); }
        }

        .btn-sonido {
            position: fixed;
            bottom: calc(14px + env(safe-area-inset-bottom)); right: 14px;
            z-index: 40;
            width: 42px; height: 42px;
            border-radius: 50%;
            border: 1px solid rgba(251, 191, 36, .5);
            background: rgba(5, 20, 30, .7);
            backdrop-filter: blur(6px);
            font-size: 1.2rem;
            cursor: pointer;
        }

        /* ---------- Tarjeta ---------- */
        .card {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 560px;
            margin-top: 14px;
            padding: 2.6rem 1.25rem 1.6rem;
            border-radius: 28px;
            background: linear-gradient(180deg, rgba(18, 58, 44, .86) 0%, rgba(8, 28, 24, .92) 100%);
            border: 1.5px solid rgba(251, 191, 36, .45);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, .55),
                inset 0 0 0 6px rgba(255, 255, 255, .03),
                0 0 60px rgba(251, 191, 36, .08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            text-align: center;
        }

        .techo-nieve {
            position: absolute;
            top: -14px; left: -6px; right: -6px;
            height: 44px;
            pointer-events: none;
            filter: drop-shadow(0 4px 4px rgba(0, 0, 0, .25));
        }
        .techo-nieve svg { width: 100%; height: 100%; display: block; }

        .acebo {
            position: absolute;
            top: -26px; left: -18px;
            width: 82px; height: 82px;
            transform: rotate(-18deg);
            filter: drop-shadow(0 6px 6px rgba(0, 0, 0, .35));
            pointer-events: none;
            z-index: 2;
        }

        .sello {
            position: absolute;
            top: -16px; right: 18px;
            z-index: 2;
            padding: .4rem .85rem;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--oro-claro), var(--oro));
            color: #451a03;
            font-weight: 900;
            font-size: .72rem;
            letter-spacing: .1em;
            text-transform: uppercase;
            border: 2px solid #fffbeb;
            box-shadow: 0 6px 16px rgba(0, 0, 0, .35);
        }

        h1 {
            margin: .6rem 0 .1rem;
            font-family: "Mountains of Christmas", "Nunito", cursive;
            font-size: clamp(2.6rem, 11vw, 3.6rem);
            line-height: 1;
            background: linear-gradient(180deg, #fffbeb 0%, var(--oro-claro) 35%, var(--oro) 70%, #d97706 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 3px 0 rgba(120, 53, 15, .55)) drop-shadow(0 0 18px rgba(251, 191, 36, .35));
        }

        .lema {
            margin: .35rem 0 .9rem;
            font-size: .95rem;
            color: var(--texto-suave);
        }

        .cuenta-atras {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            margin-bottom: 1.2rem;
            padding: .4rem .9rem;
            border-radius: 999px;
            background: rgba(220, 38, 38, .18);
            border: 1px solid rgba(248, 113, 113, .45);
            color: #fecaca;
            font-weight: 800;
            font-size: .88rem;
        }

        .error {
            color: #fecaca;
            background: rgba(127, 29, 29, .45);
            border: 1px solid rgba(248, 113, 113, .5);
            border-radius: 14px;
            padding: .8rem 1rem;
            font-weight: 700;
            line-height: 1.4;
        }

        .cargando { color: var(--texto-suave); font-weight: 700; }
        .cargando span { display: inline-block; animation: bote 1s ease-in-out infinite; }
        @keyframes bote { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

        /* Banda de bastón de caramelo */
        .caramelo {
            position: relative;
            padding: .9rem 1rem;
            margin-bottom: 1rem;
            border-radius: 16px;
            background: rgba(255, 255, 255, .06);
            font-weight: 800;
            line-height: 1.4;
        }
        .caramelo::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 16px;
            padding: 3px;
            background: repeating-linear-gradient(45deg, #ef4444 0 10px, #fff 10px 20px);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        .caramelo small { display: block; font-weight: 700; color: var(--oro-claro); margin-top: .2rem; }

        .progreso {
            margin: 0 auto 1.1rem;
            max-width: 360px;
            font-size: .85rem;
            color: var(--texto-suave);
            font-weight: 700;
        }
        .progreso-pista {
            margin-top: .4rem;
            height: 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, .1);
            overflow: hidden;
        }
        .progreso-barra {
            height: 100%;
            width: 0;
            border-radius: 999px;
            background: repeating-linear-gradient(45deg, #ef4444 0 8px, #fca5a5 8px 16px);
            transition: width .6s ease;
        }

        details.normas {
            margin-top: 1.4rem;
            text-align: left;
            border: 1px dashed rgba(251, 191, 36, .45);
            border-radius: 16px;
            background: rgba(0, 0, 0, .18);
            padding: .2rem 1rem;
        }
        details.normas summary {
            cursor: pointer;
            padding: .7rem 0;
            font-weight: 900;
            color: var(--oro-claro);
            list-style: none;
        }
        details.normas summary::-webkit-details-marker { display: none; }
        details.normas summary::after { content: " ▾"; }
        details.normas[open] summary::after { content: " ▴"; }
        details.normas ul {
            list-style: none;
            margin: 0 0 .9rem;
            padding: 0;
            display: grid;
            gap: .5rem;
            font-size: .9rem;
            color: var(--texto);
        }
        details.normas li { display: flex; gap: .55rem; line-height: 1.4; }

        /* ---------- Regalos ---------- */
        .regalos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(124px, 1fr));
            gap: 1.1rem .5rem;
        }

        .btn-regalo {
            position: relative;
            appearance: none;
            border: 0;
            background: none;
            padding: 0;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            cursor: pointer;
            font-family: inherit;
            color: inherit;
        }
        .btn-regalo .gift { animation: flotar 3.6s ease-in-out infinite; animation-delay: var(--d, 0s); }
        .btn-regalo:hover:not(:disabled) .gift,
        .btn-regalo:focus-visible .gift { animation: menear .7s ease-in-out infinite; }
        .btn-regalo:focus-visible { outline: 3px solid var(--oro); outline-offset: 4px; border-radius: 12px; }

        @keyframes flotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        @keyframes menear {
            0%, 100% { transform: rotate(0); }
            25% { transform: rotate(-6deg) translateY(-3px); }
            75% { transform: rotate(6deg) translateY(-3px); }
        }

        .gift {
            position: relative;
            font-size: 10px;
            width: 10em;
            height: 12em;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            filter: drop-shadow(0 .9em 1em rgba(0, 0, 0, .45));
        }
        .tapa {
            position: relative;
            z-index: 2;
            width: 9.6em;
            height: 2.3em;
            margin-bottom: -.25em;
            border-radius: .5em;
            background: var(--papel);
            box-shadow: inset 0 -.35em 0 rgba(0, 0, 0, .2), inset 0 .25em 0 rgba(255, 255, 255, .18);
            transition: transform .3s ease;
        }
        .tapa::before, .caja::before {
            content: "";
            position: absolute;
            top: 0; bottom: 0; left: 50%;
            width: 1.6em;
            transform: translateX(-50%);
            background: var(--cinta);
            box-shadow: inset .25em 0 0 rgba(255, 255, 255, .25), inset -.25em 0 0 rgba(0, 0, 0, .15);
        }
        .caja {
            position: relative;
            width: 8.6em;
            height: 7.4em;
            border-radius: .3em .3em .7em .7em;
            background: var(--papel);
            box-shadow: inset 0 .9em 0 rgba(0, 0, 0, .18), inset -.6em 0 0 rgba(0, 0, 0, .1);
        }
        .lazo {
            position: absolute;
            left: 50%;
            bottom: 100%;
            width: 0; height: 0;
        }
        .lazo::before, .lazo::after {
            content: "";
            position: absolute;
            bottom: -.5em;
            width: 2.7em;
            height: 1.9em;
            border: .6em solid var(--cinta);
            border-radius: 50%;
            box-shadow: inset 0 0 0 .1em rgba(0, 0, 0, .1);
        }
        .lazo::before { right: -.1em; transform: rotate(-22deg); transform-origin: right bottom; }
        .lazo::after { left: -.1em; transform: rotate(22deg); transform-origin: left bottom; }
        .nudo {
            position: absolute;
            left: 50%; top: -.75em;
            z-index: 3;
            width: 1.6em; height: 1.4em;
            transform: translateX(-50%);
            border-radius: 40%;
            background: var(--cinta);
            box-shadow: inset 0 -.2em 0 rgba(0, 0, 0, .2);
        }

        /* Papeles de regalo */
        .p0 { --papel: radial-gradient(circle, rgba(255,255,255,.35) .18em, transparent .22em) 0 0 / 1.3em 1.3em, linear-gradient(180deg, #ef4444, #991b1b); --cinta: #facc15; }
        .p1 { --papel: repeating-linear-gradient(45deg, #16a34a 0 .8em, #166534 .8em 1.6em); --cinta: #ef4444; }
        .p2 { --papel: radial-gradient(circle, rgba(255,255,255,.55) .15em, transparent .2em) 0 0 / 1.1em 1.1em, linear-gradient(180deg, #3b82f6, #1e3a8a); --cinta: #e2e8f0; }
        .p3 { --papel: repeating-linear-gradient(-45deg, #fff 0 .8em, #dc2626 .8em 1.6em); --cinta: #15803d; }
        .p4 { --papel: radial-gradient(circle, rgba(253,224,71,.7) .16em, transparent .21em) 0 0 / 1.2em 1.2em, linear-gradient(180deg, #a855f7, #6b21a8); --cinta: #fde047; }
        .p5 { --papel: radial-gradient(circle, rgba(255,255,255,.6) .17em, transparent .22em) .6em .6em / 1.2em 1.2em, linear-gradient(180deg, #fbbf24, #b45309); --cinta: #b91c1c; }

        .etiqueta {
            position: absolute;
            left: 50%;
            bottom: 26px;
            z-index: 4;
            max-width: 92%;
            transform: translateX(-50%) rotate(-4deg);
            padding: .28rem .6rem .28rem 1rem;
            border-radius: 4px 8px 8px 4px;
            background: #fffbeb;
            color: #3f1d0b;
            font-weight: 900;
            font-size: .82rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: 0 3px 8px rgba(0, 0, 0, .35);
        }
        .etiqueta::before {
            content: "";
            position: absolute;
            left: .35rem; top: 50%;
            width: 5px; height: 5px;
            margin-top: -2.5px;
            border-radius: 50%;
            background: #a16207;
        }

        .btn-regalo:disabled { cursor: not-allowed; }
        .btn-regalo:disabled .gift { animation: none; filter: grayscale(.75) brightness(.7) drop-shadow(0 .6em .8em rgba(0,0,0,.4)); }
        .btn-regalo:disabled .tapa { transform: translate(2.4em, -1.2em) rotate(24deg); }
        .btn-regalo:disabled .etiqueta { background: #cbd5e1; color: #475569; }
        .btn-regalo:disabled .etiqueta::after { content: " ✓"; color: #15803d; }

        /* ---------- Botones generales ---------- */
        .btn {
            appearance: none;
            border: 0;
            border-radius: 16px;
            font-family: inherit;
            font-weight: 900;
            font-size: 1.02rem;
            cursor: pointer;
            padding: 1rem;
            transition: transform .15s ease, filter .2s ease;
        }
        .btn:active:not(:disabled) { transform: scale(.96); }
        .btn:disabled { opacity: .55; cursor: not-allowed; }

        .btn-magia {
            width: 100%;
            position: relative;
            overflow: hidden;
            color: #fff;
            background: linear-gradient(180deg, #ef4444 0%, #b91c1c 60%, #7f1d1d 100%);
            border: 2px solid var(--oro);
            box-shadow: 0 10px 26px rgba(127, 29, 29, .55), inset 0 2px 0 rgba(255, 255, 255, .3);
            font-size: 1.15rem;
        }
        .btn-magia::after {
            content: "";
            position: absolute;
            top: 0; bottom: 0; left: -60%;
            width: 40%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .45), transparent);
            transform: skewX(-20deg);
            animation: brillo 2.8s ease-in-out infinite;
        }
        @keyframes brillo { 0% { left: -60%; } 60%, 100% { left: 130%; } }

        .btn-copiar {
            width: 100%;
            margin-top: .8rem;
            color: #052e16;
            background: linear-gradient(180deg, #86efac, #22c55e);
            border: 2px solid #f0fdf4;
            box-shadow: 0 8px 20px rgba(5, 46, 22, .5);
        }

        /* ---------- Organizador ---------- */
        .taller-titulo {
            font-family: "Mountains of Christmas", cursive;
            font-size: 1.7rem;
            color: var(--oro-claro);
            margin: 0 0 .2rem;
        }
        .familias {
            display: grid;
            gap: .7rem;
            margin: 1rem 0 1.3rem;
            text-align: left;
        }
        .familia {
            padding: .75rem .85rem;
            border-radius: 14px;
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .1);
        }
        .familia-nombre { font-weight: 900; color: var(--oro-claro); font-size: .88rem; margin-bottom: .45rem; }
        .chips { display: flex; flex-wrap: wrap; gap: .35rem; }
        .chip {
            padding: .25rem .6rem;
            border-radius: 999px;
            background: rgba(255, 255, 255, .12);
            font-size: .82rem;
            font-weight: 700;
        }
        .chip.nino { background: rgba(56, 189, 248, .2); }

        .carta {
            position: relative;
            margin-top: 1.2rem;
            padding: 1.3rem 1rem 1rem;
            border-radius: 12px;
            background: #fffbeb;
            color: #3f1d0b;
            text-align: left;
            box-shadow: 0 14px 30px rgba(0, 0, 0, .45);
            background-image: repeating-linear-gradient(180deg, transparent 0 27px, rgba(185, 28, 28, .12) 27px 28px);
        }
        .carta::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 8px;
            border-radius: 12px 12px 0 0;
            background: repeating-linear-gradient(90deg, #dc2626 0 14px, #fff 14px 20px, #15803d 20px 34px, #fff 34px 40px);
        }
        .carta-titulo { font-family: "Mountains of Christmas", cursive; font-size: 1.5rem; color: #991b1b; margin: 0 0 .3rem; }
        .carta-url {
            font-size: .78rem;
            word-break: break-all;
            background: rgba(255, 255, 255, .8);
            border: 1px dashed #d6b98c;
            border-radius: 8px;
            padding: .55rem;
        }
        .aviso {
            margin-top: .8rem;
            font-size: .82rem;
            color: #78350f;
            line-height: 1.4;
        }

        /* ---------- Modales ---------- */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 60;
            padding: 1.2rem;
            justify-content: center;
            align-items: center;
            background: rgba(2, 8, 16, .82);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .overlay.visible { display: flex; animation: aparecer .25s ease-out; }
        @keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }

        .postal {
            position: relative;
            width: 100%;
            max-width: 360px;
            padding: 1.6rem 1.3rem 1.3rem;
            border-radius: 22px;
            background: #fffbeb;
            color: #3f1d0b;
            text-align: center;
            outline: 2px dashed rgba(220, 38, 38, .55);
            outline-offset: -11px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, .6);
            animation: pop .3s cubic-bezier(.2, 1.4, .4, 1);
        }
        @keyframes pop { from { transform: scale(.85) translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
        .postal .gift { font-size: 7px; margin: 0 auto .4rem; }

    <script>
        /* =====================================================
           CONFIGURACIÓN SUPABASE
           La clave publishable es pública por diseño.
           ===================================================== */
        const SUPABASE_URL = 'https://avfcgfyztxtbemykyvrx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_W2exONJ3aqFMWfkSdSSa0w_UQRtBXme';

        const reducirMovimiento = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        /* =====================================================
           DECORACIÓN
           ===================================================== */

        // Estrellas
        (function () {
            const cont = document.getElementById('estrellas');
            for (let i = 0; i < 70; i++) {
                const s = document.createElement('span');
                s.className = 'estrella';
                s.style.left = Math.random() * 100 + '%';
                s.style.top = Math.random() * 65 + '%';
                const t = Math.random() < .2 ? 3 : 2;
                s.style.width = s.style.height = t + 'px';
                s.style.animationDelay = (-Math.random() * 3) + 's';
                s.style.animationDuration = (2 + Math.random() * 3) + 's';
                cont.appendChild(s);
            }
        })();

        // Guirnalda
        (function () {
            const g = document.getElementById('guirnalda');
            const n = Math.max(10, Math.round(window.innerWidth / 48));
            for (let i = 0; i < n; i++) {
                const b = document.createElement('span');
                b.className = 'bombilla';
                g.appendChild(b);
            }
        })();

        // Nieve sobre la tarjeta (forma irregular)
        (function () {
            let d = 'M0,0 H500 V12 ';
            let x = 500;
            const pasos = [[-22, 10], [-18, 24], [-26, 12], [-14, 30], [-30, 14], [-20, 22], [-24, 11], [-16, 28], [-28, 13], [-22, 20], [-18, 12], [-26, 26], [-20, 14], [-24, 22], [-18, 11], [-30, 18], [-22, 12], [-26, 24], [-20, 13], [-22, 16], [-20, 12]];
            let i = 0;
            while (x > 0) {
                const [dx, prof] = pasos[i % pasos.length];
                const nx = Math.max(0, x + dx);
                const mx = (x + nx) / 2;
                d += `Q${mx},${prof * 1.4} ${nx},12 `;
                x = nx; i++;
            }
            d += 'Z';
            document.getElementById('techo-nieve').innerHTML =
                `<svg viewBox="0 0 500 44" preserveAspectRatio="none"><path d="${d}" fill="#ffffff"/><path d="M0,0 H500 V6 H0Z" fill="#e2e8f0"/></svg>`;
        })();

        // Cuenta atrás a Nochebuena
        (function () {
            const hoy = new Date();
            const y = hoy.getFullYear();
            const d0 = new Date(y, hoy.getMonth(), hoy.getDate());
            let diff = Math.round((new Date(y, 11, 24) - d0) / 86400000);
            let txt;
            if (diff === 0) txt = '🌟 ¡Hoy es Nochebuena!';
            else if (diff === -1) txt = '🎄 ¡Feliz Navidad!';
            else {
                if (diff < -1) diff = Math.round((new Date(y + 1, 11, 24) - d0) / 86400000);
                txt = diff === 1 ? '⏳ ¡Mañana es Nochebuena!' : `⏳ Faltan ${diff} días para Nochebuena`;
            }
            document.getElementById('cuenta-atras').textContent = txt;
        })();

        // Nieve animada
        (function () {
            if (reducirMovimiento) return;
            const cv = document.getElementById('nieve');
            const ctx = cv.getContext('2d');
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            let W, H, copos = [];

            function tam() {
                W = window.innerWidth; H = window.innerHeight;
                cv.width = W * dpr; cv.height = H * dpr;
                cv.style.width = W + 'px'; cv.style.height = H + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                const n = Math.round(Math.min(140, W * H / 9000));
                copos = Array.from({ length: n }, () => nuevo(true));
            }
            function nuevo(inicio) {
                const r = Math.random() * 2.6 + .8;
                return { x: Math.random() * W, y: inicio ? Math.random() * H : -10, r, v: r * .35 + .25, fase: Math.random() * 6.28, amp: Math.random() * .8 + .2, a: Math.random() * .5 + .45 };
            }
            let t = 0;
            function bucle() {
                t += .01;
                ctx.clearRect(0, 0, W, H);
                for (const c of copos) {
                    c.y += c.v;
                    c.x += Math.sin(t * 2 + c.fase) * c.amp * .5 + .15;
                    if (c.y > H + 10 || c.x > W + 10) Object.assign(c, nuevo(false));
                    ctx.beginPath();
                    ctx.fillStyle = `rgba(255,255,255,${c.a})`;
                    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                    ctx.fill();
                }
                requestAnimationFrame(bucle);
            }
            window.addEventListener('resize', tam);
            tam(); bucle();
        })();

        // Confeti
        function confeti() {
            if (reducirMovimiento) return;
            const cv = document.getElementById('confeti');
            const ctx = cv.getContext('2d');
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const W = window.innerWidth, H = window.innerHeight;
            cv.width = W * dpr; cv.height = H * dpr;
            cv.style.width = W + 'px'; cv.style.height = H + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            const colores = ['#ef4444', '#fbbf24', '#22c55e', '#f8fafc', '#38bdf8', '#e879f9', '#fde68a'];
            const ox = W / 2, oy = H * .42;
            const ps = Array.from({ length: 180 }, () => {
                const ang = Math.random() * Math.PI * 2;
                const vel = Math.random() * 9 + 4;
                return {
                    x: ox, y: oy,
                    vx: Math.cos(ang) * vel, vy: Math.sin(ang) * vel - 5,
                    w: Math.random() * 8 + 4, h: Math.random() * 5 + 3,
                    rot: Math.random() * 6.28, vr: (Math.random() - .5) * .35,
                    c: colores[Math.floor(Math.random() * colores.length)],
                    redondo: Math.random() < .3
                };
            });
            const inicio = performance.now();
            (function frame(ahora) {
                const t = ahora - inicio;
                ctx.clearRect(0, 0, W, H);
                for (const p of ps) {
                    p.vy += .22; p.vx *= .985; p.vy *= .985;
                    p.x += p.vx; p.y += p.vy; p.rot += p.vr;
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, 1 - t / 3200);
                    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
                    ctx.fillStyle = p.c;
                    if (p.redondo) { ctx.beginPath(); ctx.arc(0, 0, p.h / 1.4, 0, 6.28); ctx.fill(); }
                    else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.rot * 2)) + 1);
                    ctx.restore();
                }
                if (t < 3300) requestAnimationFrame(frame);
                else ctx.clearRect(0, 0, W, H);
            })(inicio);
        }

        // Sonido de campanillas (sintetizado, sin archivos)
        let sonidoActivo = true;
        try { sonidoActivo = localStorage.getItem('ai_sonido') !== 'off'; } catch { }
        let audioCtx = null;
        const btnSonido = document.getElementById('btn-sonido');
        function pintarSonido() { btnSonido.textContent = sonidoActivo ? '🔔' : '🔕'; }
        pintarSonido();
        btnSonido.onclick = () => {
            sonidoActivo = !sonidoActivo;
            try { localStorage.setItem('ai_sonido', sonidoActivo ? 'on' : 'off'); } catch { }
            pintarSonido();
            if (sonidoActivo) { prepararAudio(); campanitas(.5); }
        };
        function prepararAudio() {
            try {
                audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch { audioCtx = null; }
        }
        function campanitas(vol = 1) {
            if (!sonidoActivo || !audioCtx) return;
            const notas = [1318.5, 1568, 2093, 1760, 2637, 2093];
            notas.forEach((f, i) => {
                const t = audioCtx.currentTime + i * .12;
                [[1, .12, 1.4], [2.76, .035, .5], [5.4, .015, .25]].forEach(([m, g, dur]) => {
                    const o = audioCtx.createOscillator();
                    const ga = audioCtx.createGain();
                    o.type = 'sine';
                    o.frequency.value = f * m;
                    ga.gain.setValueAtTime(.0001, t);
                    ga.gain.exponentialRampToValueAtTime(g * vol, t + .008);
                    ga.gain.exponentialRampToValueAtTime(.0001, t + dur);
                    o.connect(ga).connect(audioCtx.destination);
                    o.start(t); o.stop(t + dur + .05);
                });
            });
        }

        /* =====================================================
           UTILIDADES
           ===================================================== */

        async function rpc(funcion, args) {
            const resp = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${funcion}`, {
                method: 'POST',
                headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify(args),
                cache: 'no-store'
            });
            const texto = await resp.text();
            const json = texto ? JSON.parse(texto) : null;
            if (!resp.ok) throw new Error((json && json.message) || ('HTTP ' + resp.status));
            return json;
        }

        function escaparHTML(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function htmlRegalo(clase) {
            return `<div class="gift ${clase}"><div class="tapa"><div class="lazo"></div><div class="nudo"></div></div><div class="caja"></div></div>`;
        }

        function mostrarError(msg) {
            contenedor.innerHTML = `<p class="error">${escaparHTML(msg)}</p>`;
        }

        const cargandoHTML = (txt) => `<p class="cargando">${txt} <span>🎄</span></p>`;

        /* =====================================================
           ARRANQUE
           ===================================================== */

        const params = new URLSearchParams(window.location.search);
        const sorteoId = params.get('s');
        const contenedor = document.getElementById('contenido');
        let participantesJson = null;

        if (params.has('data')) {
            mostrarError('Este enlace es de una versión anterior de la página. Pide al organizador el enlace nuevo.');
        } else if (!sorteoId) {
            contenedor.innerHTML = cargandoHTML('Preparando el taller de los elfos');
            cargarParticipantes();
        } else if (!/^[0-9a-f-]{36}$/i.test(sorteoId)) {
            mostrarError('El enlace del sorteo no es válido o está incompleto.');
        } else {
            cargarSorteo();
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') actualizarEstado();
            });
        }

        /* =====================================================
           MODO ORGANIZADOR
           ===================================================== */

        async function cargarParticipantes() {
            try {
                const resp = await fetch('./participantes.json', { cache: 'no-store' });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const json = await resp.json();
                if (!Array.isArray(json.participantes) || json.participantes.length < 2) {
                    throw new Error('Se necesitan al menos 2 participantes');
                }
                participantesJson = json;
                pintarTaller();
            } catch (err) {
                mostrarError(`Error al cargar participantes.json (${err.message}).`);
            }
        }

        function pintarTaller() {
            const lista = participantesJson.participantes;
            const familias = [...new Set(lista.map(p => p.familia))];
            const bloques = familias.map(f => `
                <div class="familia">
                    <div class="familia-nombre">🏠 Familia ${escaparHTML(f)}</div>
                    <div class="chips">${lista.filter(p => p.familia === f).map(p =>
                        `<span class="chip ${p.grupo === 'nino' ? 'nino' : ''}">${p.grupo === 'nino' ? '🧸' : '🎅'} ${escaparHTML(p.nombre)}</span>`).join('')}</div>
                </div>`).join('');

            contenedor.innerHTML = `
                <h2 class="taller-titulo">El taller de los elfos</h2>
                <p class="lema" style="margin-top:0">${lista.length} participantes listos para el sorteo</p>
                <div class="familias">${bloques}</div>
                <button class="btn btn-magia" id="btn-generar">✨ Hacer el sorteo mágico ✨</button>
                <div id="zona-link"></div>
            `;
            document.getElementById('btn-generar').onclick = generarSorteo;
        }

        async function generarSorteo() {
            const btn = document.getElementById('btn-generar');
            const zona = document.getElementById('zona-link');
            prepararAudio();
            btn.disabled = true;
            btn.textContent = '🧝 Los elfos están sorteando…';

            try {
                const reglas = Object.assign({ evitarMismaFamilia: true, mismoGrupoEdad: false }, participantesJson.reglas || {});
                const id = await rpc('crear_sorteo', {
                    p_participantes: participantesJson.participantes,
                    p_reglas: reglas
                });

                const url = `${window.location.origin}${window.location.pathname}?s=${id}`;
                btn.style.display = 'none';
                zona.innerHTML = `
                    <div class="carta">
                        <div class="carta-titulo">📜 ¡Sorteo hecho!</div>
                        <p style="margin:0 0 .6rem; font-weight:700;">Nadie conoce el resultado, ni siquiera tú. Manda este enlace a las tres familias:</p>
                        <div class="carta-url">${escaparHTML(url)}</div>
                        <button class="btn btn-copiar" id="btn-copiar">📋 Copiar enlace para WhatsApp</button>
                        <div class="aviso">⚠️ Usa <strong>solo este enlace</strong>. Si recargas y haces otro sorteo, será distinto.</div>
                    </div>
                `;
                document.getElementById('btn-copiar').onclick = (e) => copiarEnlace(url, e.currentTarget);
                confeti();
                campanitas(.7);
            } catch (err) {
                btn.disabled = false;
                btn.textContent = '✨ Hacer el sorteo mágico ✨';
                zona.innerHTML = `<p class="error" style="margin-top:1rem">No se pudo crear el sorteo: ${escaparHTML(err.message)}</p>`;
            }
        }

        function copiarEnlace(url, btn) {
            const original = btn.textContent;
            const ok = () => {
                btn.textContent = '✅ ¡Enlace copiado!';
                setTimeout(() => btn.textContent = original, 2000);
            };
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(url).then(ok).catch(() => fallbackCopiar(url) && ok());
            } else if (fallbackCopiar(url)) {
                ok();
            }
        }

        function fallbackCopiar(texto) {
            const ta = document.createElement('textarea');
            ta.value = texto;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            let ok = false;
            try { ok = document.execCommand('copy'); } catch { ok = false; }
            ta.remove();
            return ok;
        }

        /* =====================================================
           MODO PARTICIPANTE
           ===================================================== */

        const botones = {};
        let total = 0;

        function htmlNormas(reglas) {
            const items = [
                '<li>🎲 <span>Reparto aleatorio hecho por el ordenador. Nadie conoce el resultado completo.</span></li>',
                '<li>🎅 <span>A nadie puede tocarse a sí mismo.</span></li>',
                reglas.evitarMismaFamilia
                    ? '<li>🏠 <span>No se regala a nadie de tu propia familia.</span></li>'
                    : '<li>🏠 <span>Se permite regalar dentro de la misma familia.</span></li>',
                reglas.mismoGrupoEdad
                    ? '<li>🧸 <span>Adultos regalan a adultos y niños a niños.</span></li>'
                    : '<li>🎁 <span>Sorteo abierto entre mayores y peques.</span></li>',
                '<li>🔒 <span>Cada regalo solo se puede abrir una vez, desde cualquier móvil.</span></li>'
            ];
            return `<details class="normas"><summary>📜 Normas del sorteo</summary><ul>${items.join('')}</ul></details>`;
        }

        async function cargarSorteo() {
            contenedor.innerHTML = cargandoHTML('Buscando los regalos bajo el árbol');
            try {
                const filas = await rpc('estado_sorteo', { p_sorteo: sorteoId });
                if (!filas || filas.length === 0) {
                    mostrarError('Este sorteo no existe. Revisa el enlace.');
                    return;
                }
                total = filas.length;

                contenedor.innerHTML = `
                    <div class="caramelo">
                        🎁 Busca el regalo con tu nombre y ábrelo
                        <small>⏱️ Solo podrás ver a quién te toca durante 5 segundos</small>
                    </div>
                    <div class="progreso">
                        <span id="progreso-texto"></span>
                        <div class="progreso-pista"><div class="progreso-barra" id="progreso-barra"></div></div>
                    </div>
                    <div class="regalos" id="regalos"></div>
                    ${htmlNormas(filas[0].reglas || {})}
                `;
                const grid = document.getElementById('regalos');

                filas.forEach(({ nombre, visto }, i) => {
                    const clase = 'p' + (i % 6);
                    const btn = document.createElement('button');
                    btn.className = 'btn-regalo';
                    btn.style.setProperty('--d', `${-(i * .45)}s`);
                    btn.innerHTML = `${htmlRegalo(clase)}<span class="etiqueta"></span>`;
                    btn.querySelector('.etiqueta').textContent = nombre;
                    btn.onclick = () => pedirConfirmacion(nombre);
                    botones[nombre] = { btn, clase };
                    grid.appendChild(btn);
                    marcarBoton(nombre, visto);
                });
                pintarProgreso();
            } catch (err) {
                mostrarError('No se pudo cargar el sorteo (' + err.message + '). Comprueba la conexión y recarga.');
            }
        }

        async function actualizarEstado() {
            try {
                const filas = await rpc('estado_sorteo', { p_sorteo: sorteoId });
                (filas || []).forEach(({ nombre, visto }) => marcarBoton(nombre, visto));
                pintarProgreso();
            } catch { /* sin conexión: se mantiene lo que hay */ }
        }

        function marcarBoton(nombre, visto) {
            const b = botones[nombre];
            if (!b) return;
            b.btn.disabled = !!visto;
            b.btn.setAttribute('aria-label', visto ? `Regalo de ${nombre} (ya abierto)` : `Regalo de ${nombre}`);
        }

        function pintarProgreso() {
            const abiertos = Object.values(botones).filter(b => b.btn.disabled).length;
            const txt = document.getElementById('progreso-texto');
            const barra = document.getElementById('progreso-barra');
            if (!txt) return;
            txt.textContent = abiertos === total
                ? `🎉 ¡Los ${total} regalos están abiertos!`
                : `🎁 ${abiertos} de ${total} regalos abiertos`;
            barra.style.width = (total ? abiertos / total * 100 : 0) + '%';
        }

        function pedirConfirmacion(persona) {
            const modal = document.getElementById('modal-confirm');
            const btnConfirmar = document.getElementById('btn-confirmar-ver');
            document.getElementById('confirm-nombre').textContent = persona;
            document.getElementById('confirm-regalo').innerHTML = htmlRegalo(botones[persona].clase);
            btnConfirmar.disabled = false;
            btnConfirmar.textContent = '🎁 ¡Soy yo, abrir!';
            modal.classList.add('visible');

            btnConfirmar.onclick = async () => {
                prepararAudio();
                btnConfirmar.disabled = true;
                btnConfirmar.textContent = '⏳ Abriendo…';
                try {
                    const tocado = await rpc('revelar', { p_sorteo: sorteoId, p_nombre: persona });
                    cerrarConfirmacion();
                    marcarBoton(persona, true);
                    pintarProgreso();
                    revelar(tocado, botones[persona].clase);
                } catch (err) {
                    cerrarConfirmacion();
                    if (err.message === 'YA_VISTO') {
                        marcarBoton(persona, true);
                        pintarProgreso();
                        alert(`El regalo de ${persona} ya se abrió. Si ha sido un error, avisa al organizador.`);
                    } else {
                        alert('No se pudo abrir el regalo (' + err.message + '). Inténtalo de nuevo.');
                    }
                }
            };
        }

        function cerrarConfirmacion() {
            document.getElementById('modal-confirm').classList.remove('visible');
        }

        function revelar(tocado, clase) {
            const modal = document.getElementById('modal-reveal');
            const escena = document.getElementById('escena');
            const resultado = document.getElementById('resultado');
            const contador = document.getElementById('contador');
            const anillo = document.getElementById('anillo-avance');

            resultado.textContent = '';
            escena.classList.remove('abierta', 'temblar');
            document.getElementById('regalo-grande').innerHTML = htmlRegalo(clase);
            anillo.style.transition = 'none';
            anillo.style.strokeDashoffset = '0';
            contador.textContent = '5';
            modal.classList.add('visible');

            void escena.offsetWidth;
            escena.classList.add('temblar');

            setTimeout(() => {
                resultado.textContent = tocado;
                escena.classList.add('abierta');
                confeti();
                campanitas();

                void anillo.getBoundingClientRect();
                anillo.style.transition = 'stroke-dashoffset 5s linear';
                anillo.style.strokeDashoffset = '150.8';

                let segundos = 5;
                const intervalo = setInterval(() => {
                    segundos--;
                    contador.textContent = String(Math.max(segundos, 0));
                    if (segundos <= 0) {
                        clearInterval(intervalo);
                        modal.classList.remove('visible');
                        resultado.textContent = '';
                        escena.classList.remove('abierta', 'temblar');
                    }
                }, 1000);
            }, reducirMovimiento ? 0 : 950);
        }
    </script>
</body>
</html>
