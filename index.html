<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigo Invisible · Noche de Regalos</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>">
    <style>
        :root {
            --night-1: #071b16;
            --night-2: #113227;
            --night-3: #2a090d;
            --paper: #fffdf8;
            --paper-warm: #f8f2e4;
            --crimson: #b91c1c;
            --crimson-deep: #7f1d1d;
            --pine: #166534;
            --pine-deep: #052e16;
            --gold: #eab308;
            --gold-bright: #fde047;
            --ink: #1e293b;
            --ink-soft: #475569;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background:
                radial-gradient(circle at 20% 10%, rgba(253, 224, 71, 0.12), transparent 35%),
                radial-gradient(circle at 80% 18%, rgba(220, 38, 38, 0.16), transparent 40%),
                linear-gradient(165deg, var(--night-1) 0%, var(--night-2) 52%, var(--night-3) 100%);
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1rem 1.75rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Luces navideñas en la parte superior */
        .string-lights {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 28px;
            display: flex;
            justify-content: space-evenly;
            align-items: flex-start;
            background: rgba(5, 18, 14, 0.75);
            border-bottom: 1px solid rgba(234, 179, 8, 0.35);
            z-index: 20;
            pointer-events: none;
        }

        .bulb {
            width: 11px;
            height: 15px;
            border-radius: 0 0 999px 999px;
            margin-top: 2px;
            animation: twinkle 2.4s ease-in-out infinite;
        }

        .bulb:nth-child(4n+1) { background: #ef4444; box-shadow: 0 0 10px #ef4444; animation-delay: 0s; }
        .bulb:nth-child(4n+2) { background: #fde047; box-shadow: 0 0 10px #fde047; animation-delay: 0.6s; }
        .bulb:nth-child(4n+3) { background: #22c55e; box-shadow: 0 0 10px #22c55e; animation-delay: 1.2s; }
        .bulb:nth-child(4n+4) { background: #38bdf8; box-shadow: 0 0 10px #38bdf8; animation-delay: 1.8s; }

        @keyframes twinkle {
            0%, 100% { opacity: 0.55; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.08); }
        }

        .snowflakes {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .flake {
            position: absolute;
            top: -24px;
            color: rgba(255, 255, 255, 0.32);
            animation: drift linear infinite;
            user-select: none;
        }

        @keyframes drift {
            0% { transform: translateY(-24px) translateX(0) rotate(0deg); }
            50% { transform: translateY(50vh) translateX(16px) rotate(180deg); }
            100% { transform: translateY(108vh) translateX(-14px) rotate(360deg); }
        }

        /* Tarjeta principal con aire de postal navideña */
        .card {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 510px;
            background: linear-gradient(180deg, var(--paper) 0%, var(--paper-warm) 100%);
            border-radius: 26px;
            padding: 2.2rem 1.5rem 1.8rem;
            box-shadow:
                0 28px 65px rgba(0, 0, 0, 0.6),
                0 0 0 2px rgba(234, 179, 8, 0.45),
                inset 0 0 0 6px rgba(255, 255, 255, 0.7);
            text-align: center;
        }

        .seal {
            position: absolute;
            top: -14px;
            right: 22px;
            background: linear-gradient(135deg, var(--gold-bright), var(--gold));
            color: #422006;
            font-size: 0.72rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0.35rem 0.75rem;
            border-radius: 999px;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
            border: 2px solid #fffdf8;
        }

        .eyebrow {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--pine);
            background: rgba(22, 101, 52, 0.1);
            padding: 0.3rem 0.8rem;
            border-radius: 999px;
            margin-bottom: 0.5rem;
        }

        h1 {
            margin: 0 0 1rem;
            font-size: 2.25rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--crimson) 0%, var(--crimson-deep) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            margin: 0 0 1rem;
            font-size: 0.94rem;
            color: var(--ink-soft);
            line-height: 1.45;
        }

        /* Bloque de reglas y aviso de 5 segundos */
        .rules-box {
            background: #ffffff;
            border: 1px solid #e2d9c5;
            border-top: 4px solid var(--pine);
            border-radius: 18px;
            padding: 1rem 1.05rem;
            margin-bottom: 1.25rem;
            text-align: left;
            box-shadow: 0 6px 18px rgba(15, 23, 42, 0.05);
        }

        .rules-title {
            font-size: 0.82rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--pine-deep);
            margin: 0 0 0.6rem;
        }

        .rules-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 0.48rem;
            font-size: 0.88rem;
            color: var(--ink);
        }

        .rules-list li {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            line-height: 1.38;
        }

        .timer-alert {
            margin-top: 0.8rem;
            padding: 0.65rem 0.8rem;
            background: linear-gradient(135deg, #fef2f2, #fee2e2);
            border: 1px solid #fca5a5;
            border-radius: 12px;
            color: var(--crimson-deep);
            font-size: 0.86rem;
            font-weight: 800;
            text-align: center;
            line-height: 1.38;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.8rem;
        }

        .btn {
            appearance: none;
            border: none;
            border-radius: 15px;
            padding: 0.95rem 0.75rem;
            font-family: inherit;
            font-size: 0.98rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.14s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .btn:active:not(:disabled) { transform: scale(0.96); }

        .btn-person {
            position: relative;
            background: linear-gradient(180deg, #dc2626 0%, var(--crimson-deep) 100%);
            color: #ffffff;
            box-shadow: 0 6px 16px rgba(127, 29, 29, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(253, 224, 71, 0.35);
        }

        .btn-person:hover:not(:disabled) {
            filter: brightness(1.07);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(127, 29, 29, 0.35);
        }

        .btn-person:disabled {
            background: #e2e8f0;
            color: #94a3b8;
            border-color: #cbd5e1;
            box-shadow: none;
            cursor: not-allowed;
            text-decoration: line-through;
        }

        .btn-action {
            width: 100%;
            background: linear-gradient(180deg, #15803d 0%, var(--pine-deep) 100%);
            color: #ffffff;
            padding: 1.05rem;
            font-size: 1.05rem;
            box-shadow: 0 8px 20px rgba(5, 46, 22, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.22);
            border: 1px solid rgba(253, 224, 71, 0.4);
        }

        .btn-action:disabled { opacity: 0.55; cursor: not-allowed; }

        .link-box {
            margin-top: 1.15rem;
            background: #ffffff;
            border: 1.5px dashed #cbd5e1;
            border-radius: 14px;
            padding: 0.85rem;
            text-align: left;
            font-size: 0.8rem;
            word-break: break-all;
            color: #334155;
        }

        .btn-copy {
            margin-top: 0.7rem;
            width: 100%;
            background: linear-gradient(180deg, var(--night-2) 0%, var(--night-1) 100%);
            color: var(--gold-bright);
            border: 1px solid rgba(234, 179, 8, 0.45);
            padding: 0.82rem;
            font-size: 0.92rem;
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(5, 16, 12, 0.88);
            backdrop-filter: blur(6px);
            padding: 1.5rem;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        .modal-box {
            background: var(--paper);
            color: var(--ink);
            width: 100%;
            max-width: 380px;
            border-radius: 24px;
            padding: 2rem 1.5rem;
            text-align: center;
            box-shadow: 0 28px 60px rgba(0, 0, 0, 0.6);
            animation: revealPop 0.22s ease-out;
        }

        @keyframes revealPop {
            from { opacity: 0; transform: scale(0.9) translateY(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.25rem;
        }

        .btn-cancel { flex: 1; background: #e2e8f0; color: #334155; }
        .btn-confirm { flex: 1; background: linear-gradient(180deg, #dc2626, var(--crimson-deep)); color: #fff; }

        .gift-reveal {
            background: linear-gradient(155deg, var(--pine) 0%, var(--night-1) 58%, var(--night-3) 100%);
            color: #ffffff;
            border: 2px solid var(--gold);
            box-shadow: 0 0 35px rgba(234, 179, 8, 0.25), 0 25px 60px rgba(0, 0, 0, 0.65);
        }

        .nombre-tocado {
            font-size: 2.35rem;
            font-weight: 900;
            color: var(--gold-bright);
            margin: 0.85rem 0;
            text-shadow: 0 3px 14px rgba(0, 0, 0, 0.5);
        }

        .progress-track {
            width: 100%;
            height: 9px;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 999px;
            overflow: hidden;
            margin-top: 1rem;
        }

        .progress-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--gold), var(--gold-bright));
            transition: width 1s linear;
        }

        .timer-text {
            font-size: 0.86rem;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 0.65rem;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="string-lights" aria-hidden="true">
        <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
        <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
        <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
    </div>

    <div class="snowflakes" id="snowflakes" aria-hidden="true"></div>

    <main class="card">
        <div class="seal">🎁 Navidad</div>
        <div class="eyebrow">✦ Sorteo Familiar ✦</div>
        <h1>🎄 Amigo Invisible</h1>
        <div id="contenido"></div>
    </main>

    <div class="overlay" id="modal-confirm">
        <div class="modal-box">
            <div style="font-size: 2.4rem; margin-bottom: 0.4rem;">🎀</div>
            <h2 style="margin: 0 0 0.5rem; font-size: 1.3rem;">¿Eres <span id="confirm-nombre"></span>?</h2>
            <p class="subtitle" style="margin-bottom: 0;">Asegúrate de que nadie más esté mirando. Al pulsar verás tu resultado solo durante <strong>5 segundos</strong>.</p>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="cerrarConfirmacion()">Cancelar</button>
                <button class="btn btn-confirm" id="btn-confirmar-ver">Sí, ver (5s)</button>
            </div>
        </div>
    </div>

    <div class="overlay" id="modal-reveal">
        <div class="modal-box gift-reveal">
            <div style="font-size: 2.4rem;">🎅✨🎄</div>
            <p style="margin: 0.45rem 0 0; opacity: 0.92;">Te ha tocado regalar a:</p>
            <div class="nombre-tocado" id="resultado"></div>
            <div class="progress-track">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <p class="timer-text" id="contador">Solo visible 5s · Se cerrará en 5s...</p>
        </div>
    </div>

    <script>
        (function crearNieve() {
            const cont = document.getElementById('snowflakes');
            if (!cont) return;
            const copos = ['❄', '❅', '✦', '❆'];
            for (let i = 0; i < 18; i++) {
                const span = document.createElement('span');
                span.className = 'flake';
                span.textContent = copos[i % copos.length];
                span.style.left = `${(i * 5.8) % 100}%`;
                span.style.fontSize = `${0.8 + (i % 4) * 0.25}rem`;
                span.style.animationDuration = `${8 + (i % 6) * 2.2}s`;
                span.style.animationDelay = `${-(i * 1.3)}s`;
                cont.appendChild(span);
            }
        })();

        const params = new URLSearchParams(window.location.search);
        const dataParam = params.get('data');
        const rulesParam = params.get('reglas');
        const contenedor = document.getElementById('contenido');

        let configSorteo = {
            reglas: { evitarMismaFamilia: true, mismoGrupoEdad: false },
            participantes: []
        };

        function renderInstruccionesParticipante(reglas) {
            const criterios = [
                '<li>🎲 <span>Reparto aleatorio generado automáticamente sin intervención manual.</span></li>',
                '<li>🎅 <span>A nadie puede tocarse a sí mismo.</span></li>',
                reglas.evitarMismaFamilia
                    ? '<li>🏠 <span>No se permite regalar a alguien de la misma familia.</span></li>'
                    : '<li>🏠 <span>Se permite regalar dentro de la misma familia.</span></li>',
                reglas.mismoGrupoEdad
                    ? '<li>🧸 <span>Adultos regalan a adultos y niños regalan a niños.</span></li>'
                    : '<li>🎁 <span>Sorteo abierto entre adultos y niños (respetando familias).</span></li>'
            ];

            return `
                <section class="rules-box" aria-label="Instrucciones y reglas del sorteo">
                    <div class="rules-title">📜 Cómo se ha hecho el sorteo y cómo participar</div>
                    <ul class="rules-list">${criterios.join('')}</ul>
                    <div class="timer-alert">⏱️ Pulsa en tu nombre y tienes 5 segundos para saber quién te ha tocado antes de que se oculte.</div>
                </section>
            `;
        }

        if (!dataParam) {
            contenedor.innerHTML = `
                <div id="estado-error"></div>
                <button class="btn btn-action" id="btn-generar" onclick="generarSorteo()" disabled>🎄 Generar Enlace del Sorteo</button>
                <div id="zona-link"></div>
            `;
            cargarParticipantes();
        } else {
            try {
                const asignaciones = JSON.parse(decodeURIComponent(atob(dataParam)));
                let reglasActivas = { evitarMismaFamilia: true, mismoGrupoEdad: false };
                if (rulesParam) {
                    reglasActivas = Object.assign(reglasActivas, JSON.parse(decodeURIComponent(atob(rulesParam))));
                }

                const storageKey = 'vistos_' + dataParam.slice(0, 12);
                const vistos = JSON.parse(localStorage.getItem(storageKey) || '[]');

                contenedor.innerHTML = `
                    ${renderInstruccionesParticipante(reglasActivas)}
                    <div class="grid" id="grid"></div>
                `;
                const grid = document.getElementById('grid');

                Object.keys(asignaciones).forEach(persona => {
                    const btn = document.createElement('button');
                    btn.className = 'btn btn-person';
                    btn.textContent = persona;
                    if (vistos.includes(persona)) {
                        btn.disabled = true;
                        btn.textContent = `${persona} ✓`;
                    }
                    btn.onclick = () => pedirConfirmacion(persona, asignaciones[persona], btn, storageKey);
                    grid.appendChild(btn);
                });
            } catch (e) {
                contenedor.innerHTML = `<p class="subtitle" style="color:#b91c1c; font-weight:700;">El enlace del sorteo no es válido o está incompleto.</p>`;
            }
        }

        async function cargarParticipantes() {
            const btnGenerar = document.getElementById('btn-generar');
            const estadoError = document.getElementById('estado-error');

            try {
                const resp = await fetch('./participantes.json', { cache: 'no-store' });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const json = await resp.json();

                configSorteo = {
                    reglas: Object.assign({ evitarMismaFamilia: true, mismoGrupoEdad: false }, json.reglas || {}),
                    participantes: Array.isArray(json.participantes) ? json.participantes : []
                };

                if (configSorteo.participantes.length < 2) {
                    throw new Error('Se necesitan al menos 2 participantes');
                }

                btnGenerar.disabled = false;
            } catch (err) {
                estadoError.innerHTML = `<p class="subtitle" style="color:#b91c1c; font-weight:700;">Error al cargar participantes.json (${err.message}).</p>`;
            }
        }

        function generarSorteo() {
            const lista = configSorteo.participantes;
            const reglas = configSorteo.reglas;
            let valido = false;
            let resultado = {};
            let intentos = 0;

            while (!valido && intentos < 10000) {
                intentos++;
                let receptores = [...lista].sort(() => Math.random() - 0.5);
                valido = true;
                resultado = {};

                for (let i = 0; i < lista.length; i++) {
                    const dador = lista[i];
                    const receptor = receptores[i];

                    if (dador.nombre === receptor.nombre) {
                        valido = false;
                        break;
                    }
                    if (reglas.evitarMismaFamilia && dador.familia === receptor.familia) {
                        valido = false;
                        break;
                    }
                    if (reglas.mismoGrupoEdad && dador.grupo && receptor.grupo && dador.grupo !== receptor.grupo) {
                        valido = false;
                        break;
                    }
                    resultado[dador.nombre] = receptor.nombre;
                }
            }

            if (!valido) {
                alert("No se encontró un reparto válido con esas reglas. Revisa las familias o grupos en participantes.json.");
                return;
            }

            const payload = btoa(encodeURIComponent(JSON.stringify(resultado)));
            const rulesEncoded = btoa(encodeURIComponent(JSON.stringify(reglas)));
            const urlFinal = `${window.location.origin}${window.location.pathname}?data=${payload}&reglas=${rulesEncoded}`;

            document.getElementById('zona-link').innerHTML = `
                <div class="link-box" id="url-texto">${urlFinal}</div>
                <button class="btn btn-copy" onclick="copiarEnlace('${urlFinal}', this)">📋 Copiar enlace para WhatsApp</button>
            `;
        }

        function copiarEnlace(url, btn) {
            navigator.clipboard.writeText(url).then(() => {
                const original = btn.textContent;
                btn.textContent = "✅ ¡Enlace copiado!";
                setTimeout(() => btn.textContent = original, 2000);
            });
        }

        function pedirConfirmacion(persona, tocado, boton, storageKey) {
            const modalConfirm = document.getElementById('modal-confirm');
            document.getElementById('confirm-nombre').textContent = persona;
            modalConfirm.style.display = 'flex';

            const btnConfirmar = document.getElementById('btn-confirmar-ver');
            btnConfirmar.onclick = () => {
                cerrarConfirmacion();
                revelar(persona, tocado, boton, storageKey);
            };
        }

        function cerrarConfirmacion() {
            document.getElementById('modal-confirm').style.display = 'none';
        }

        function revelar(persona, tocado, boton, storageKey) {
            const modal = document.getElementById('modal-reveal');
            const contador = document.getElementById('contador');
            const bar = document.getElementById('progress-bar');

            document.getElementById('resultado').textContent = tocado;
            bar.style.transition = 'none';
            bar.style.width = '100%';
            modal.style.display = 'flex';

            const vistos = JSON.parse(localStorage.getItem(storageKey) || '[]');
            if (!vistos.includes(persona)) {
                vistos.push(persona);
                localStorage.setItem(storageKey, JSON.stringify(vistos));
            }

            boton.disabled = true;
            boton.textContent = `${persona} ✓`;

            void bar.offsetWidth;
            bar.style.transition = 'width 5s linear';
            bar.style.width = '0%';

            let segundos = 5;
            contador.textContent = `Solo visible 5s · Se cerrará en ${segundos}s...`;
            const intervalo = setInterval(() => {
                segundos--;
                contador.textContent = `Solo visible 5s · Se cerrará en ${segundos}s...`;
                if (segundos <= 0) {
                    clearInterval(intervalo);
                    modal.style.display = 'none';
                }
            }, 1000);
        }
    </script>
</body>
</html>
