<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigo Invisible · Especial Navidad</title>
    <style>
        :root {
            --bg-top: #0b241d;
            --bg-mid: #163b2e;
            --bg-bottom: #260c10;
            --card-bg: #fffdf9;
            --red: #c81d25;
            --red-dark: #9b1118;
            --green: #1e5631;
            --green-dark: #143d22;
            --gold: #f4b41a;
            --text: #1e293b;
            --muted: #57606f;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at top, var(--bg-mid) 0%, var(--bg-top) 48%, var(--bg-bottom) 100%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.2rem 1rem 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        .garland {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            padding: 6px 10px;
            background: linear-gradient(90deg, rgba(20, 61, 34, 0.95), rgba(155, 17, 24, 0.95), rgba(20, 61, 34, 0.95));
            border-bottom: 2px solid var(--gold);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
            z-index: 20;
            font-size: 0.95rem;
            user-select: none;
        }

        .snowflakes {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .flake {
            position: absolute;
            top: -24px;
            color: rgba(255, 255, 255, 0.35);
            animation: fall linear infinite;
            user-select: none;
        }

        @keyframes fall {
            0% { transform: translateY(-24px) translateX(0) rotate(0deg); }
            50% { transform: translateY(52vh) translateX(14px) rotate(180deg); }
            100% { transform: translateY(108vh) translateX(-10px) rotate(360deg); }
        }

        .card {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 2rem 1.5rem;
            box-shadow: 0 24px 55px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(244, 180, 26, 0.35);
            text-align: center;
            border-top: 7px solid var(--red);
            border-bottom: 5px solid var(--green);
        }

        .ribbon {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: linear-gradient(135deg, #fff4d2, #ffe39f);
            color: #7c4700;
            border: 1px solid rgba(244, 180, 26, 0.6);
            font-size: 0.78rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 0.35rem 0.85rem;
            border-radius: 999px;
            margin-bottom: 0.65rem;
        }

        h1 {
            margin: 0 0 0.9rem;
            font-size: 2.15rem;
            font-weight: 800;
            line-height: 1.1;
            color: var(--red);
        }

        .subtitle {
            margin: 0 0 1rem;
            font-size: 0.95rem;
            color: var(--muted);
            line-height: 1.45;
        }

        .rules-box {
            background: #f8faf7;
            border: 1px solid #d5e5d8;
            border-left: 5px solid var(--green);
            border-radius: 16px;
            padding: 0.95rem 1rem;
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .rules-title {
            font-size: 0.84rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--green-dark);
            margin: 0 0 0.55rem;
        }

        .rules-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 0.42rem;
            font-size: 0.88rem;
            color: var(--text);
        }

        .rules-list li {
            display: flex;
            align-items: flex-start;
            gap: 0.45rem;
            line-height: 1.38;
        }

        .timer-alert {
            margin-top: 0.75rem;
            padding: 0.6rem 0.75rem;
            background: #fff1f2;
            border: 1px solid #fecdd3;
            border-radius: 10px;
            color: #9f1239;
            font-size: 0.86rem;
            font-weight: 700;
            text-align: center;
            line-height: 1.38;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }

        .btn {
            appearance: none;
            border: none;
            border-radius: 14px;
            padding: 0.95rem 0.7rem;
            font-family: inherit;
            font-size: 0.98rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.12s ease, filter 0.2s ease;
        }

        .btn:active:not(:disabled) { transform: scale(0.97); }

        .btn-person {
            background: linear-gradient(180deg, var(--red) 0%, var(--red-dark) 100%);
            color: #ffffff;
            box-shadow: 0 5px 14px rgba(155, 17, 24, 0.28);
        }

        .btn-person:hover:not(:disabled) { filter: brightness(1.06); }

        .btn-person:disabled {
            background: #e5e7eb;
            color: #9ca3af;
            box-shadow: none;
            cursor: not-allowed;
            text-decoration: line-through;
        }

        .btn-action {
            width: 100%;
            background: linear-gradient(180deg, #276f40 0%, var(--green-dark) 100%);
            color: #ffffff;
            padding: 1rem;
            font-size: 1.05rem;
            box-shadow: 0 6px 18px rgba(20, 61, 34, 0.32);
        }

        .btn-action:disabled { opacity: 0.6; cursor: not-allowed; }

        .link-box {
            margin-top: 1.15rem;
            background: #f8f9fa;
            border: 1.5px dashed #cbd5e1;
            border-radius: 12px;
            padding: 0.85rem;
            text-align: left;
            font-size: 0.8rem;
            word-break: break-all;
            color: #334155;
        }

        .btn-copy {
            margin-top: 0.7rem;
            width: 100%;
            background: var(--bg-top);
            color: #fff;
            padding: 0.8rem;
            font-size: 0.92rem;
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(8, 22, 17, 0.9);
            backdrop-filter: blur(5px);
            padding: 1.5rem;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        .modal-box {
            background: var(--card-bg);
            color: var(--text);
            width: 100%;
            max-width: 380px;
            border-radius: 22px;
            padding: 2rem 1.5rem;
            text-align: center;
            box-shadow: 0 25px 55px rgba(0, 0, 0, 0.55);
        }

        .modal-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.25rem;
        }

        .btn-cancel { flex: 1; background: #e5e7eb; color: #374151; }
        .btn-confirm { flex: 1; background: var(--red); color: #fff; }

        .gift-reveal {
            background: linear-gradient(150deg, #1b4332 0%, #0d241b 65%, #3d0c11 100%);
            color: #ffffff;
            border: 2px solid var(--gold);
        }

        .nombre-tocado {
            font-size: 2.3rem;
            font-weight: 800;
            color: var(--gold);
            margin: 0.85rem 0;
        }

        .progress-track
